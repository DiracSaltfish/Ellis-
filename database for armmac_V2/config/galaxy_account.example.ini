[galaxy]
# One or more authorized TGW internet-mode endpoints separated by spaces.
# IMPORTANT: each授权账号 is provisioned on one specific VIP cluster.  Point
# this host list at the cluster that hosts THIS account.  In 2026-09 live
# verification the dedicated macOS (“第二授权账号”) logged in only on the
# secondary internet VIP; the primary VIP rejected it at ReqLogon with status
# -98.  If you hit -98, confirm the account-to-VIP mapping before anything else.
host = <TGW_HOST_FOR_THIS_ACCOUNT>
# 0 means the documented internet-mode default 8600.
port = 0
username = <AUTHORIZED_USERNAME>
password = <AUTHORIZED_PASSWORD>
# Keep False unless a previous crashed run left the account's session active
# and you have confirmed no other process should be kicked.
force_logout = False
api_mode = kInternetMode
