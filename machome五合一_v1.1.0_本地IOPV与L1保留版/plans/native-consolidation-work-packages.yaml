global_rules:
  - Do not modify, install, start, stop, or reconfigure any baseline program.
  - Do not deploy to machome without a new explicit user instruction.
  - Tests must default to fixtures, record-only sinks, fake QMT, and disabled notifications.
  - Runtime artifacts must not import, execute, link, or read code from baseline paths.
  - Premium scope is A-server and A UI only; B is protocol compatibility only.

tasks:
  - id: G-00
    title: Freeze manifests and golden replay corpus
    depends_on: []
    deliverables:
      - tools/read-only-baseline-manifest
      - fixtures/upload
      - fixtures/premium
      - fixtures/webull
      - fixtures/redemption
      - provenance manifests with redacted inputs
    gate:
      - Fixture tests run without baseline processes.
      - Baseline directory hashes and mtimes are unchanged.

  - id: G-01
    title: Introduce IModuleEngine and ModuleContext
    depends_on: [G-00]
    deliverables:
      - Native engine lifecycle interface
      - Four mock engines on four QThreads
      - Bounded command and snapshot channels
      - Legacy clients isolated behind test-only probes
    gate:
      - One blocked mock engine does not block UI or the other engines.
      - Agent shutdown and restart recovery tests pass.

  - id: G-02
    title: Build injectable ClockService and ScheduleCoordinator
    depends_on: [G-01]
    deliverables:
      - Virtual clock
      - Idempotent scheduled-job ledger
      - Catch-up and sleep/wake behavior
      - Schedule timeline snapshot for UI
    gate:
      - All documented market and daily boundaries pass deterministic tests.
      - Wall clock and monotonic timeout responsibilities are separated.

  - id: G-03
    title: Build shared storage credential notification and server services
    depends_on: [G-02]
    deliverables:
      - Per-module data roots and migrations
      - Secret references without secret echo
      - Bounded notification queues
      - Reusable HTTP WS TCP and UDS components
    gate:
      - Slow disk and malformed client tests do not block unrelated engines.
      - Security and redaction tests pass.

  - id: G-04
    title: Switch native UI to typed Agent engine events
    depends_on: [G-03]
    deliverables:
      - Engine snapshot and event DTOs
      - UI routing retained without localhost data dependency
      - Reference-counted detail subscriptions
    gate:
      - Existing four module page tests pass against mock native engines.
      - Closing detail pages releases subscriptions.

  - id: G-05
    title: Add no-legacy build and runtime gates
    depends_on: [G-04]
    deliverables:
      - Legacy path and Mach-O dependency scanner
      - Child-process allowlist audit
      - Native-only production config schema
      - Isolated test with baseline paths unavailable
    gate:
      - Bundle contains no baseline absolute path or executable dependency.
      - Production config contains no old labels or managed baseline processes.

  - id: P-01
    title: Import Premium A core into new namespace
    depends_on: [G-05]
    deliverables:
      - app/modules/premium/engine
      - Source provenance and hash manifest
      - B client and trading code exclusion test
    gate:
