schema_version: 1
plan: native-consolidation-detailed-checklist
execution: internal_checklist_not_independently_dispatched
workspace: /Users/ellis/工具程序开发/machome四合一运行改造cpp
read_only_baselines:
  - /Users/ellis/newnavnav
  - /Users/ellis/工具程序开发/溢价率拉升监控cpp
  - /Users/ellis/Desktop/ETF交割/WebullData
