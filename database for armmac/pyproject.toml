[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tgw-macos-arm64"
version = "1.0.9.2.5"
description = "Authorized macOS arm64 interoperability implementation for TGW internet mode"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "zstandard>=0.23; python_version < '3.14'",
]

[project.optional-dependencies]
dataframe = ["pandas>=2.0"]
dev = ["build>=1.2"]

[tool.setuptools.packages.find]
where = ["src/python"]
include = ["tgw_macos*"]

[tool.setuptools.package-data]
tgw_macos = ["cert/*.crt"]
