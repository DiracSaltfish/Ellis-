[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "galaxy-bridge-client"
version = "1.0.0"
description = "银河星耀 AmazingData 局域网桥接 · Mac 客户端"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.31",
    "pandas>=2.0",
    "websocket-client>=1.7",
]

[tool.setuptools.packages.find]
where = ["src"]
