# galaxy-bridge-server 配置文件
# 部署在 Windows 桥接机上；包含银河服务器默认登录信息（仅限本机保存，勿外传/勿提交git）
# 所有键均可用环境变量覆盖：GALAXY_BRIDGE_<节>_<键>，如 GALAXY_BRIDGE_GALAXY_PASSWORD

[galaxy]
# ---- 银河「星耀数智」账号信息：联系开户营业部申请开通权限后获取 ----
# 账号必须以 tgw_ 开头
username = tgw_REPLACE_ME
password = REPLACE_ME
# 银河数据服务器 IP 与端口
host = REPLACE_ME_SERVER_IP
port = 7000
# 登录模式：kInternetMode(互联网模式) / kColocationMode(托管机房模式)
api_mode = kInternetMode
# 登录时踢掉同账号旧会话（避免多端登录互踢导致频繁掉线）
force_logout = true

[local_cache]
# AmazingData hdf5 本地缓存根目录（Windows 绝对路径）。
# 客户端调用带 local_path 参数的接口时无需传路径，服务端自动使用此处配置。
root = D:\AmazingData_local_data

[bridge]
# 局域网监听地址：0.0.0.0 表示整个局域网可访问（请配合防火墙限制来源子网）
listen_host = 0.0.0.0
listen_port = 8900
# 访问令牌：客户端需携带 X-API-Key 头（WebSocket 用 ?api_key= 参数）。留空则不鉴权。
api_key = CHANGE_ME_TO_A_RANDOM_STRING
# 底层 SDK 调用最大并发数（SDK 线程安全性未知，保守取值即可）
max_concurrent = 2
# 断线后台重连间隔（秒）
reconnect_interval = 60
log_level = INFO
log_file = logs\bridge.log

# 可选：服务启动并登录成功后自动订阅的行情（JSON 数组格式，单行）
# 示例：订阅沪深300ETF与平安银行的快照、1分钟K线
# subscribe = [{"period":"snapshot","code_list":["510300.SH","000001.SZ"]},
#              {"period":"min1","code_list":["510300.SH"]}]
subscribe =
