[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tgw-macos-re"
version = "1.0.9.2.2"
description = "Authorized macOS arm64 interoperability implementation for TGW internet mode"
requires-python = ">=3.10"
dependencies = [
  "zstandard>=0.23; python_version < '3.14'",
]

[project.optional-dependencies]
dataframe = ["pandas>=2.0"]

[tool.setuptools.packages.find]
where = ["src_reconstructed/python"]
include = ["tgw_macos*", "amazingdata_re*"]
